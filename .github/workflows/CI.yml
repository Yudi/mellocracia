name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: false
  NX_NO_CLOUD: true

jobs:
  prisma-migrations:
    name: Prisma migrations on an empty database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mellocracia
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: mellocracia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mellocracia -d mellocracia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mellocracia:ci-password@localhost:5432/mellocracia

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy migrations
        run: bun run prisma:migrate:deploy

      - name: Verify schema has no drift
        run: >-
          bun x prisma migrate diff
          --config apps/backend/prisma.config.ts
          --from-config-datasource
          --to-schema apps/backend/prisma/schema.prisma
          --exit-code

  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run prisma:generate

      - name: Check formatting
        run: bun x nx format:check

      - name: Lint all projects
        run: bun x nx run-many --target=lint --all --parallel=3

      - name: Test backend
        run: bun test apps/backend/test

      - name: Type-check workspace
        run: bun run typecheck

      - name: Build backend and web
        run: bun x nx run-many --target=build --projects=backend,web --parallel=2

  production-images:
    name: Production image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: apps/backend/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check Dockerfile syntax
        run: docker build --check --file "${{ matrix.dockerfile }}" .

      - name: Build production image
        run: >-
          docker build
          --file "${{ matrix.dockerfile }}"
          --tag "mellocracia-${{ matrix.app }}:ci"
          --build-arg PUBLIC_API_BASE_URL=/api
          .

      - name: Verify non-root runtime
        run: |
          user="$(docker image inspect "mellocracia-${{ matrix.app }}:ci" --format '{{.Config.User}}')"
          test -n "$user"
          test "$user" != "0"
          test "$user" != "0:0"
          test "$user" != "root"

  compose:
    name: Render Compose deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Render deployment
        run: |
          touch docker/.env
          trap 'rm -f docker/.env' EXIT
          DATABASE_URL=postgresql://mellocracia:ci@db:5432/mellocracia \
            POSTGRES_PASSWORD=ci-password \
            docker compose --env-file /dev/null --file docker/docker-compose.yml config --quiet
